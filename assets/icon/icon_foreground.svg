      A 28,28 0 0 1 702,320
      L 702,692
      L 654.5,712
      L 607,692
      L 559.5,712
      L 512,692
      L 464.5,712
      L 417,692
      L 369.5,712
      L 322,692
      L 322,320
      A 28,28 0 0 1 350,292
      Z
    "/>

    <!-- Item lines -->
    <rect x="382" y="366" width="260" height="20" rx="10" fill="#4F46E5"/>
    <rect x="382" y="414" width="220" height="20" rx="10" fill="#4F46E5"/>
    <rect x="382" y="462" width="190" height="20" rx="10" fill="#4F46E5"/>

